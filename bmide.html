<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMIDE</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-page="bmide">
    <div class="app">
      <header class="topbar">
        <img src="assets/ntn-logo.png" alt="NTN Europe" />
      </header>

      <nav class="main-menu" aria-label="Menu principal">
        <a class="menu-button" href="index.html" data-page-link="badgeage">Badgeage</a>
        <a class="menu-button" href="notes.html" data-page-link="notes">Notes</a>
        <a class="menu-button" href="liens.html" data-page-link="links">Liens</a>
        <a class="menu-button active" href="bmide.html" data-page-link="bmide">BMIDE</a>
        <a class="menu-button" href="historique.html" data-page-link="history">Historique</a>
      </nav>

      <main id="bmide-view" class="bmide-layout">
        <section id="bmide-status-card" class="bmide-status-card free" aria-live="polite">
          <span class="label">Statut BMIDE</span>
          <strong id="bmide-state" class="bmide-state">BMIDE libre</strong>
          <p id="bmide-owner" class="bmide-owner">Disponible</p>
          <p id="bmide-since" class="bmide-since">Dernière mise à jour --</p>

          <div class="bmide-action-row">
            <input id="bmide-name" type="text" autocomplete="name" placeholder="Ton nom" />
            <button id="bmide-toggle" class="bmide-toggle-button free" type="button">Prendre le BMIDE</button>
          </div>

          <p id="bmide-message" class="bmide-message">Connexion Supabase en cours...</p>
        </section>

        <section class="bmide-side-panel">
          <div class="section-heading">
            <h2>Action rapide</h2>
            <button id="bmide-refresh" class="ghost-button" type="button">Rafraîchir</button>
          </div>

          <div class="bmide-help">
            <span class="label">Principe</span>
            <p>Vert: le BMIDE est libre. Rouge: quelqu'un l'utilise.</p>
            <p>Renseigne ton nom, puis prends ou libère le BMIDE quand tu changes d'état.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
